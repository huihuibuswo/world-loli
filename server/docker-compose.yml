services:
  postgres:
    image: postgres:17-alpine
    container_name: world-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-world}
      POSTGRES_USER: ${POSTGRES_USER:-world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - world_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-world}
      PGUSER: ${POSTGRES_USER:-world}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./database:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - >-
        for file in /migrations/[0-9][0-9][0-9]_*.sql; do
          echo "Applying $$file";
          psql -v ON_ERROR_STOP=1 -f "$$file";
        done

  api:
    build:
      context: ../server-rust
    container_name: world-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BIND_ADDRESS: 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api-python:
    profiles: ["python-fallback"]
    image: world-loli-api-python:pre-rust-cutover-20260730
    container_name: world-api-python
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PYTHON_FALLBACK_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  world_postgres_data:
